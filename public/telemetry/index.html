<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetry</title>
    <link rel="stylesheet" href="./telemetry.css">
</head>
<body class="dark-theme">
    <a href="../index.html" id="back-link">&larr; Back to game</a>
    <h2 class="heading">Telemetry</h2>
    <button id="clear-button" class="clear-button">Clear history</button>

    <section>
        <h3 id="log-heading">Live Log</h3>
        <p id="log-empty" class="empty-note">No ticks recorded yet &mdash; start the game to see live telemetry.</p>
        <div id="log-tables" class="driver-tables hidden">
            <div class="driver-table">
                <h4 id="log-name-a" class="driver-name"></h4>
                <table id="log-table-a">
                    <thead>
                        <tr><th>Category</th><th>Obstacle</th><th>Result</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="driver-table">
                <h4 id="log-name-b" class="driver-name"></h4>
                <table id="log-table-b">
                    <thead>
                        <tr><th>Category</th><th>Obstacle</th><th>Result</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </section>

    <section>
        <h3>Recent Games</h3>
        <p id="results-empty" class="empty-note">No finished games yet.</p>
        <div id="results-content" class="hidden">
            <table id="summary-table" class="summary-table">
                <thead>
                    <tr>
                        <th>Round</th>
                        <th>Winner</th>
                        <th>Time</th>
                        <th id="summary-name-a"></th>
                        <th id="summary-name-b"></th>
                    </tr>
                </thead>
                <tbody id="summary-body"></tbody>
            </table>

            <div id="results-tables" class="driver-tables">
                <div class="driver-table">
                    <h4 id="results-name-a" class="driver-name"></h4>
                    <table id="results-table-a">
                        <thead>
                            <tr><th>Round</th><th>Score</th><th>Penguins</th><th>Water</th><th>Crack</th><th>Walls</th><th>Coll.</th></tr>
                        </thead>
                        <tbody id="results-body-a"></tbody>
                    </table>
                </div>
                <div class="driver-table">
                    <h4 id="results-name-b" class="driver-name"></h4>
                    <table id="results-table-b">
                        <thead>
                            <tr><th>Round</th><th>Score</th><th>Penguins</th><th>Water</th><th>Crack</th><th>Walls</th><th>Coll.</th></tr>
                        </thead>
                        <tbody id="results-body-b"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <script type="module" src="./telemetry.js"></script>
</body>
</html>
